<style>
:root{--ac:#12b0ff;--bg:#f2f3f7;--cd:#fff;--tx:#1c1c1e;--sub:#8e8e93;--ln:#e3e4e8}
body.dk{--bg:#111214;--cd:#1e2024;--tx:#f2f2f5;--sub:#8b8d94;--ln:#2c2e33}
*{box-sizing:border-box}
body{margin:0;height:100vh;font-family:-apple-system,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.ib{width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center}
.ib:hover{background:var(--ln)}.ib:active{transform:scale(.92)}.ib.on{background:var(--ac);color:#fff}
.pill{background:var(--ac);color:#fff;border-radius:20px;padding:9px 18px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
input,select{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:8px 12px;outline:0}
.hide{display:none!important}
/* libreria */
#lib{height:100%;display:flex;flex-direction:column;padding:26px 34px 0}
#lh{display:flex;align-items:center;gap:12px}#lh h1{margin:0;font-size:34px;font-weight:800;flex:1}#q{width:230px}
#chips{display:flex;gap:8px;padding:18px 0 14px;overflow-x:auto}
.chip{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:7px 16px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}.chip .x{opacity:.6;font-size:15px}
#grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px;align-content:start;padding:6px 4px 40px}
.card{cursor:pointer;position:relative}
.card .th{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px #0002;aspect-ratio:1/1.414;border:2px solid transparent}
.card:hover .th{border-color:var(--ac)}.card canvas{width:100%;height:100%;display:block}
.card b{display:block;margin:8px 4px 0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{margin:0 4px;color:var(--sub);font-size:12px}
.card .del{position:absolute;top:8px;right:8px;background:#000a;color:#fff;border-radius:50%;width:26px;height:26px;display:none;align-items:center;justify-content:center}
.card:hover .del{display:flex}.card .del svg{width:14px;height:14px}
.card.new .th{display:flex;align-items:center;justify-content:center;border:2px dashed var(--ln);background:var(--cd);box-shadow:none;color:var(--ac)}
.card.new svg{width:38px;height:38px}#nbin{width:150px;padding:5px 12px;border-radius:20px}
/* editor */
#ed{height:100%;display:flex;flex-direction:column}
#nav{height:56px;display:flex;align-items:center;gap:6px;padding:0 14px;background:var(--cd);border-bottom:1px solid var(--ln)}
#nav .sp{flex:1}#title{text-align:center;font-weight:600;border:0;background:transparent;width:280px;font-size:16px}
#wrap{flex:1;overflow:auto;padding:30px 30px 20px 100px;background:var(--bg)}
#pages{display:flex;flex-direction:column;align-items:center;gap:40px;width:max-content;min-width:100%;margin:0 auto}
.pg{position:relative;flex:none}.pg canvas{background:#fff;box-shadow:0 4px 22px #0004;border-radius:4px;touch-action:none;cursor:crosshair;display:block}
.pn{position:absolute;bottom:-26px;right:2px;font-size:12px;color:var(--sub)}
.pg input.tx{position:absolute;background:transparent;border:1px dashed var(--ac);border-radius:4px;padding:0 2px;min-width:140px;outline:0}
#more{height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--sub);font-size:12px;flex:none}
#more .ring{--p:0deg;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--ac) var(--p),var(--ln) 0);display:flex;align-items:center;justify-content:center}
#more button{width:54px;height:54px;border-radius:50%;background:var(--cd);color:var(--ac);display:flex;align-items:center;justify-content:center}
#more svg{width:26px;height:26px}
#tb{position:absolute;left:18px;top:76px;bottom:20px;display:flex;align-items:center;pointer-events:none;z-index:5}
#tbi{pointer-events:auto;background:var(--cd);border-radius:22px;box-shadow:0 6px 26px #0003;padding:10px 6px;display:flex;flex-direction:column;gap:3px;align-items:center;max-height:100%;overflow:auto}
.sw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:1px solid #0003;outline:2px solid transparent;outline-offset:1px;margin:2px 0;flex:none}.sw.on{outline-color:var(--tx)}
.cw{width:30px;height:30px;border-radius:50%;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);display:flex;align-items:center;justify-content:center;cursor:pointer;margin:4px 0;flex:none}
.cw i{width:14px;height:14px;border-radius:50%;border:2px solid var(--cd);display:block}
#tbi hr{width:26px;border:0;border-top:1px solid var(--ln);margin:6px 0}
#w{width:70px;transform:rotate(-90deg);margin:34px 0;padding:0;accent-color:var(--ac)}
#pop{position:fixed;z-index:30;background:var(--cd);border:1px solid var(--ln);border-radius:14px;box-shadow:0 10px 34px #0004;padding:8px;min-width:190px;max-height:90vh;overflow:auto}
#pop .row{padding:8px 12px;border-radius:8px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:14px}
#pop .row:hover{background:var(--ln)}#pop label{font-size:12px;color:var(--sub);display:block;margin:6px 12px 4px}
#pop .th{display:flex;gap:8px;padding:4px 12px}#pop .th i{width:24px;height:24px;border-radius:50%;cursor:pointer;display:block;border:2px solid var(--cd);outline:2px solid transparent}#pop .th i.on{outline-color:var(--tx)}
#pop select{width:calc(100% - 24px);margin:0 12px}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:6px 8px}.pal i{aspect-ratio:1;border-radius:50%;cursor:pointer;border:1px solid #0003;display:block}
#wh{display:block;margin:8px auto;cursor:crosshair;border-radius:50%}
#pop input[type=range]{width:100%;padding:0;accent-color:var(--ac)}#hx{width:100%;margin-top:6px;text-align:center}
</style><style>
#lock{position:fixed;inset:0;z-index:99999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#lock form{background:var(--cd);border-radius:22px;padding:30px 26px;width:100%;max-width:340px;box-shadow:0 10px 40px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:12px}
#lock h1{margin:0 0 4px;font-size:26px}
#lock input[type=text],#lock input[type=password]{font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);outline:none}
#lock input:focus{border-color:var(--ac)}
#lock label{font-size:14px;color:var(--sub);display:flex;gap:8px;align-items:center}
#lock button{font:inherit;font-weight:600;font-size:16px;padding:12px;border:0;border-radius:12px;background:var(--ac);color:#fff;cursor:pointer}
#lock .er{color:#e63946;font-size:14px;min-height:18px}
#askov{position:fixed;inset:0;z-index:9999;background:#0006;display:flex;align-items:center;justify-content:center;padding:20px}
.askb{background:var(--cd);color:var(--tx);border-radius:18px;padding:22px;max-width:320px;width:100%;box-shadow:0 10px 40px #0004}
.askb p{margin:0 0 18px;font-size:16px;font-weight:600}.askb div{display:flex;gap:10px;justify-content:flex-end}
.askb button{font:inherit;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--bg);color:var(--tx)}.askb .d{background:#e63946;color:#fff;font-weight:600}
@media(hover:none){.card .del{display:flex;width:32px;height:32px}.card .del svg{width:16px;height:16px}.chip .x{padding:0 4px;font-size:18px}}
#lob{padding:10px 0 calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center}
#logout{font:inherit;font-weight:700;font-size:16px;width:100%;max-width:420px;padding:14px;border:0;border-radius:14px;background:#e63946;color:#fff;cursor:pointer}
#logout:active{transform:scale(.98)}
#splash{position:fixed;inset:0;z-index:100000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:#2a1a40;overflow:hidden;animation:sOut .45s 2.55s forwards}
#splash::before{content:'';position:absolute;inset:-24px;background:linear-gradient(#0003,#0003),var(--photo) center/cover no-repeat;filter:blur(5px);z-index:-1}
#splash h1{text-shadow:0 2px 14px #0008}
#splash{isolation:isolate}
#splash .w{position:relative;width:132px;height:132px}
#splash img{width:132px;height:132px;border-radius:28px;opacity:0;transform:scale(.3) rotate(-10deg);animation:sPop 1s cubic-bezier(.2,1.5,.4,1) .2s forwards;filter:drop-shadow(0 12px 22px #0007)}
#splash .ring{position:absolute;inset:-26px;border-radius:50%;border:2px solid #fff3;border-top-color:#fff;opacity:0;animation:sFi .5s .4s forwards,sSpin 1.6s linear infinite}
#splash h1{font-weight:300;font-size:min(54px,11vw);letter-spacing:8px;margin:30px 0 6px 8px;display:flex}
#splash h1 span{opacity:0;transform:translateY(18px);animation:sUp .5s forwards}
#splash .bar{width:230px;height:3px;background:#fff4;margin-top:22px;border-radius:2px;overflow:hidden}
#splash .bar div{height:100%;width:0;background:#fff;animation:sLd 2.5s .4s ease-in-out forwards}
@keyframes sPop{to{transform:none;opacity:1}}@keyframes sFi{to{opacity:1}}@keyframes sUp{to{opacity:1;transform:none}}
@keyframes sLd{to{width:100%}}@keyframes sSpin{to{transform:rotate(360deg)}}@keyframes sOut{to{opacity:0}}

#lib{position:relative;isolation:isolate}
#lib::before{content:'';position:fixed;inset:-60px;z-index:-1;background:var(--photo) center/cover no-repeat;filter:blur(16px);opacity:.3;pointer-events:none}
body.dk #lib::before{opacity:.2}
html,body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
#wrap{overscroll-behavior:contain}
.pg canvas{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.pg canvas.ov{position:absolute;left:0;top:0;pointer-events:none;background:transparent;box-shadow:none;border-radius:0}
.pill.sec{background:var(--cd);color:var(--ac);border:1px solid var(--ln)}
#lh .pill{white-space:nowrap}
.pg{background:#fff;box-shadow:0 4px 22px #0004;border-radius:4px}.pg canvas{box-shadow:none}
#busyov{position:fixed;inset:0;z-index:9999;background:#0006;display:flex;align-items:center;justify-content:center;padding:20px}
.bz{min-width:260px}.bz .bar{display:block;height:6px;border-radius:3px;background:var(--ln);overflow:hidden}.bz .bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;z-index:10000;max-width:86vw;box-shadow:0 6px 24px #0004;display:none}
.af{display:flex;align-items:center;gap:6px;padding:6px 4px 6px 8px;border-radius:8px}
.af .ai{width:36px;height:36px;border-radius:8px;background:var(--ln);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.af .ai img{width:100%;height:100%;object-fit:cover}

const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');

/* Sostituto web delle API Electron: IndexedDB per i dati, localStorage per la lingua, download per PNG/PDF */
const api=(()=>{
  const DB='taccuino',ST='kv';
  let dbp=null;const open=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>{dbp=null;rej(r.error)}}));
  const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
  const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
  const dl=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
  const b64=u=>{const s=atob(u.split(',')[1]),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a};
  const safe=n=>(n||'Taquimunte').replace(/[\\\/:*?"<>|]+/g,'_');
  const jpegOf=u=>new Promise(res=>{const i=new Image();i.onload=()=>{if(u.startsWith('data:image/jpeg')){res({w:i.width,h:i.height,d:b64(u)});return}const c=document.createElement('canvas');c.width=i.width;c.height=i.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0);res({w:c.width,h:c.height,d:b64(c.toDataURL('image/jpeg',.92))})};i.src=u});
  async function pdf(urls){
    const imgs=[];for(const u of urls)imgs.push(await jpegOf(u));
    const enc=new TextEncoder(),parts=[],off=[];let len=0;
    const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};

function hsv(h,s,v){const i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);let r,g,b;

 ctx.putImageData(img,0,0)}

let penSeen=false;try{penSeen=localStorage.getItem('taq.pen')==='1'}catch(e){}
function liveSeg(ctx,s,i){const K=KINDS[s.k],p=s.p;ctx.strokeStyle=s.c;ctx.lineCap='round';ctx.lineJoin='round';ctx.globalAlpha=1;ctx.setLineDash([]);
 ctx.beginPath();
 if(i===0){ctx.lineWidth=s.w*(K.v?(p[0][2]||1):1);ctx.moveTo(p[0][0],p[0][1]);ctx.lineTo(p[0][0]+.01,p[0][1])}
 else if(K.v){ctx.lineWidth=s.w*((p[i][2]||1)+(p[i-1][2]||1))/2;ctx.moveTo(p[i-1][0],p[i-1][1]);ctx.lineTo(p[i][0],p[i][1])}
 else{ctx.lineWidth=s.w;const a=i>=2?[(p[i-2][0]+p[i-1][0])/2,(p[i-2][1]+p[i-1][1])/2]:p[0];ctx.moveTo(a[0],a[1]);
  ctx.quadraticCurveTo(p[i-1][0],p[i-1][1],(p[i-1][0]+p[i][0])/2,(p[i-1][1]+p[i][1])/2)}
 ctx.stroke()}
function bind(c,pi){const ov=c.ov,octx=ov.getContext('2d',{desynchronized:true}),mc=c.getContext('2d');
 octx.setTransform(DPR,0,0,DPR,0,0);
 let raf=0,drawn=0,aid=null,ts=null,ix=null;
 const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
 const ew=()=>Math.round(8+width*3);
 const ring=(pt,w)=>{octx.clearRect(0,0,W,H);octx.beginPath();octx.arc(pt[0],pt[1],w/2,0,7);octx.lineWidth=3;octx.strokeStyle='#fff';octx.stroke();octx.lineWidth=1;octx.strokeStyle='#444';octx.stroke()};
 const frame=()=>{raf=0;
  if(!stroke||stroke.pg!==pi)return;const s=stroke;
  if(s.k==='erase'){/* gomma a pixel: si scava nel livello dell'inchiostro e si ricompone sullo sfondo */
   if(!ix)return;const lx=ix.getContext('2d');lx.save();lx.setTransform(DPR,0,0,DPR,0,0);lx.globalCompositeOperation='destination-out';lx.strokeStyle='#000';lx.lineWidth=s.w;lx.lineCap='round';lx.lineJoin='round';
   for(;drawn<s.p.length;drawn++){const p=s.p[drawn],q=s.p[drawn?drawn-1:0];lx.beginPath();lx.moveTo(q[0],q[1]);lx.lineTo(p[0]+(drawn?0:.01),p[1]);lx.stroke()}
   lx.restore();mc.save();mc.setTransform(DPR,0,0,DPR,0,0);paintBase(mc,note(),pi,DPR);mc.drawImage(ix,0,0,W,H);mc.restore();ring(s.p[s.p.length-1],s.w);return}
  const K=KINDS[s.k];
  if(s.k==='shape'||K.a<1||K.dash||K.wave){octx.clearRect(0,0,W,H);drawStroke(octx,s)}
  else{for(;drawn<s.p.length;drawn++)liveSeg(octx,s,drawn)}};
 const sched=()=>{if(!raf)raf=requestAnimationFrame(frame)};
 const addPt=e=>{const pt=pos(e);
  if(!stroke||stroke.pg!==pi)return;
  if(stroke.k==='shape'){stroke.b=pt;return}
  const K=KINDS[stroke.k],last=stroke.p[stroke.p.length-1],dist=Math.hypot(pt[0]-last[0],pt[1]-last[1]);if(dist<.6)return;
  const dt=Math.max(e.timeStamp-stroke.t,1),pen=e.pointerType==='pen'&&e.pressure>0;let q=[+pt[0].toFixed(1),+pt[1].toFixed(1)];
  if(K.v){const target=K.v===1?(pen?.5+e.pressure*1.2:Math.min(1.25,Math.max(.45,1.25-dist/dt*.35))):(pen?e.pressure*2.2:Math.min(1.7,Math.max(.3,1.7-dist/dt*.6)));
   q.push(+(last[2]*.6+target*.4).toFixed(2))}
  stroke.p.push(q);stroke.t=e.timeStamp};
 c.oncontextmenu=e=>e.preventDefault();
 c.onpointerdown=e=>{e.preventDefault();
  if(e.pointerType==='pen'&&!penSeen){penSeen=true;try{localStorage.setItem('taq.pen','1')}catch(x){}}
  if(e.pointerType==='touch'&&penSeen){ /* con la penna in uso, il dito fa scorrere la pagina */
   if(ts||stroke)return;const w=$('wrap');c.setPointerCapture(e.pointerId);
   ts={id:e.pointerId,x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t0:e.timeStamp,vx:0,vy:0,lt:e.timeStamp,w};return}
  if(stroke||ts)return;
  const pt=pos(e);
  if(tool==='text'){textBox(c,pi,pt);return}
  c.setPointerCapture(e.pointerId);aid=e.pointerId;
  if(tool==='shape'){stroke={pg:pi,k:'shape',s:shapeKind,a:pt,b:pt,c:color,w:width};sched();return}
  drawn=0;
  if(tool==='er'){ix=INK;ix.width=W*DPR;ix.height=H*DPR;const lx=ix.getContext('2d');lx.setTransform(DPR,0,0,DPR,0,0);note().pages[pi].strokes.forEach(s=>drawStroke(lx,s));
   stroke={pg:pi,k:'erase',c:'#000',w:ew(),p:[pt],t:e.timeStamp};sched();return}
  const k=tool==='hl'?hlKind:penKind,K=KINDS[k];
  stroke={pg:pi,k,c:color,w:+(width*K.wm).toFixed(1),p:[K.v?[pt[0],pt[1],1]:pt],t:e.timeStamp};sched()};
 c.onpointermove=e=>{
  if(ts&&e.pointerId===ts.id){const dx=e.clientX-ts.x,dy=e.clientY-ts.y,dt=Math.max(e.timeStamp-ts.lt,1);
   ts.w.scrollTop-=dy;ts.w.scrollLeft-=dx;ts.vx=dx/dt;ts.vy=dy/dt;ts.x=e.clientX;ts.y=e.clientY;ts.lt=e.timeStamp;return}
  if(e.pointerId!==aid){if(tool==='er'&&!stroke&&e.pointerType!=='touch')ring(pos(e),ew());return}
  const l=e.getCoalescedEvents?e.getCoalescedEvents():null;
  if(l&&l.length)l.forEach(addPt);else addPt(e);sched()};
 c.onpointerleave=()=>{if(!stroke)octx.clearRect(0,0,W,H)};
 const end=e=>{
  if(ts&&e&&e.pointerId===ts.id){const t=ts;ts=null;
   if(e.type==='pointerup'&&tool==='text'&&Math.hypot(e.clientX-t.x0,e.clientY-t.y0)<8&&e.timeStamp-t.t0<400){textBox(c,pi,pos(e));return}
   if(e.timeStamp-t.lt>80)return;let vx=t.vx,vy=t.vy;
   const step=()=>{if(Math.abs(vx)<.02&&Math.abs(vy)<.02)return;t.w.scrollTop-=vy*16;t.w.scrollLeft-=vx*16;vx*=.95;vy*=.95;requestAnimationFrame(step)};step();return}
  if(e&&e.pointerId!==aid)return;aid=null;
  if(raf){cancelAnimationFrame(raf);raf=0}
  if(stroke&&stroke.pg===pi){const n=note();let s=stroke;stroke=null;
   if(s.k==='erase'){ix=null;INK.width=INK.height=0;octx.clearRect(0,0,W,H);delete s.t;snap();n.pages[pi].strokes.push(s);n.t=Date.now();save();redrawPage(pi);return}
   if(s.k==='shape'&&Math.hypot(s.b[0]-s.a[0],s.b[1]-s.a[1])<3){octx.clearRect(0,0,W,H);return}
   delete s.t;snap();n.pages[pi].strokes.push(s);n.t=Date.now();save();
   mc.save();mc.setTransform(DPR,0,0,DPR,0,0);drawStroke(mc,s);mc.restore();octx.clearRect(0,0,W,H)}};
 c.onpointerup=end;c.onpointercancel=end}
function textBox(c,pi,pt){const fs=12+width*2,i=document.createElement('input');i.className='tx';i.placeholder=T.txt;
 i.style.left=pt[0]*Z+'px';i.style.top=pt[1]*Z+'px';i.style.fontSize=fs*Z+'px';i.style.color=color;let done=false;
 const commit=ok=>{if(done)return;done=true;const v=i.value.trim();i.remove();
  if(ok&&v){const n=note();snap();n.pages[pi].strokes.push({k:'text',t:v,x:pt[0]+2,y:pt[1],fs,c:color});n.t=Date.now();save();redrawPage(pi)}};
 i.onkeydown=e=>{if(e.key==='Enter')commit(true);if(e.key==='Escape')commit(false)};i.onblur=()=>commit(true);
 c.parentNode.append(i);setTimeout(()=>i.focus(),0)}

(async()=>{const d=await api.load();
 if(d&&d.notes){S=Object.assign(S,d);S.set=Object.assign({dark:false,ac:THEMES[0],quick:['#1c1c1e','#1f59e6','#e63946','#2a9d5c','#f28c1a']},d.set);
  S.notes.forEach(n=>{if(!n.pages){n.pages=[{strokes:n.strokes||[]}];delete n.strokes}})}
 color=S.set.quick[0];theme();renderLib();if(d&&d.notes)api.gc(new Set(S.notes.flatMap(blobIds)))})();
